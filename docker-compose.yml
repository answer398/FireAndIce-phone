services:
  fireandice:
    image: fireandice-phone:latest
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${HTTP_PORT:-8080}}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_URL:-http://localhost:${HTTP_PORT:-8080}}}
      EMPTY_ROOM_TTL_MS: ${EMPTY_ROOM_TTL_MS:-600000}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
