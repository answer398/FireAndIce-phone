<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="森林冰火人 1-6，创建房间，把链接发给朋友一起玩。">
  <title>森林冰火人 · 双人联机</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="games/lib/lobby/lobby.css">
  <style>
    :root { color-scheme: dark; --safe-x: max(18px, env(safe-area-inset-left)); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1118; }
    body { min-height: 100dvh; overflow-x: hidden; color: #f5f7fb; font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 0%, rgba(255, 81, 73, .22), transparent 32rem), radial-gradient(circle at 88% 100%, rgba(48, 187, 255, .17), transparent 34rem), #0d1118; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) var(--safe-x) calc(34px + env(safe-area-inset-bottom)); }
    .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 24px; }
    .brand-mark { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
    h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2.35rem); letter-spacing: 0; }
    .brand p { margin: 3px 0 0; color: #a9b2c1; }
    .portal-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); gap: 16px; align-items: start; }
    .portal-section { min-width: 0; padding: 20px; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(19,24,34,.88); box-shadow: 0 16px 50px rgba(0,0,0,.18); }
    .portal-section h2 { margin: 0 0 5px; font-size: 1.15rem; }
    .portal-section > p { margin: 0 0 15px; color: #a9b2c1; font-size: .92rem; }
    #lobby-mp { width: 100%; max-width: none; margin: 0; }
    #lobby-mp .lbp-box { padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    #lobby-mp .lbp-head { display: none; }
    .game-guide { display: grid; gap: 9px; }
    .game-guide-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(255,255,255,.035); }
    .game-guide-row strong { font-weight: 650; }
    .game-guide-row span { color: #99a4b5; font-size: .84rem; text-align: right; }
    footer { margin-top: 18px; color: #778295; font-size: .8rem; }
    @media (max-width: 760px) { .portal-grid { grid-template-columns: 1fr; } .portal-section { padding: 17px; } }
  </style>
</head>
<body>
  <main>
    <header class="brand"><img class="brand-mark" src="img/icon.png" alt=""><div><h1>森林冰火人 · 双人联机</h1><p>创建一个房间，把链接发给朋友，马上开始。</p></div></header>
    <div class="portal-grid">
      <section class="portal-section" aria-labelledby="room-title"><h2 id="room-title">创建联机房间</h2><p>房主选择游戏，朋友加入后会自动看到同一选择。</p><div id="lobby-mp" aria-label="双人联机大厅"></div></section>
      <section class="portal-section" aria-labelledby="games-title"><h2 id="games-title">游戏选择</h2><p>六部游戏都保留原始关卡与资源。</p><div class="game-guide" aria-label="六部游戏入口"><div class="game-guide-row"><strong>1 · 森林神庙</strong><span>The Forest Temple</span></div><div class="game-guide-row"><strong>2 · 光明神庙</strong><span>The Light Temple</span></div><div class="game-guide-row"><strong>3 · 寒冰圣殿</strong><span>The Ice Temple</span></div><div class="game-guide-row"><strong>4 · 水晶殿</strong><span>The Crystal Temple</span></div><div class="game-guide-row"><strong>5 · 元素</strong><span>Elements</span></div><div class="game-guide-row"><strong>6 · 童话</strong><span>Fairy Tales</span></div></div></section>
    </div>
    <footer>无需注册。桌面端支持键盘，手机横屏体验最佳。</footer>
  </main>
  <script type="module" src="games/lib/lobby/lobby.js"></script>
</body>
</html>
